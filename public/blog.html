<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Incremento Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* Blog admin */
.bl-write{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.9rem;color:#0b1017;background:linear-gradient(135deg,var(--lime),var(--cyan));border:none;padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 18px -8px rgba(158,245,74,.5)}
.bl-write:disabled{opacity:.6;cursor:default}
.bl-sched{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:18px;display:flex;flex-direction:column;gap:14px}
.bl-sched.off{opacity:.72}
.bl-sr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bl-sr .lbl{font-size:0.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);min-width:72px}
.bl-sw{width:44px;height:25px;border-radius:14px;border:1px solid var(--border2);background:var(--surface3);cursor:pointer;padding:0;position:relative;flex:none;transition:var(--trans)}
.bl-sw span{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--text-dim);transition:left .16s,background .16s}
.bl-sw.on{background:rgba(158,245,74,.22);border-color:var(--lime)}
.bl-sw.on span{left:21px;background:var(--lime)}
.bl-sw-txt{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1rem;color:var(--text)}
.bl-dpill{font-family:'Space Grotesk',sans-serif;font-size:0.85rem;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--text-dim);cursor:pointer;transition:var(--trans)}
.bl-dpill:hover{border-color:var(--cyan);color:var(--text)}
.bl-dpill.on{border-color:var(--lime);background:rgba(158,245,74,.12);color:var(--lime)}
.bl-sched input[type=date]{font-family:'Inter',sans-serif;font-size:0.95rem;padding:7px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);outline:none;color-scheme:dark}
.bl-sched input[type=date]:focus{border-color:var(--cyan)}
.bl-next{background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--lime);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px}
.bl-next .k{font-size:0.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.bl-next .t{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:600;color:var(--text)}
.bl-next .w{font-size:0.95rem;color:var(--text-sub);margin-top:4px}
.bl-next.paused{border-left-color:var(--amber)}
.bl-next.empty{border-left-color:var(--slate)}
.bl-addwrap{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.bl-addwrap input{font-family:'Inter',sans-serif;font-size:1rem;padding:11px 14px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);outline:none}
.bl-addwrap input:focus{border-color:var(--cyan)}
#bl-title{flex:1;min-width:260px}
#bl-kw{width:200px}
.bl-addbtn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.9rem;color:var(--text);background:var(--surface3);border:1px solid var(--border2);padding:11px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:var(--trans)}
.bl-addbtn:hover{border-color:var(--lime);color:var(--lime)}
.bl-tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:18px}
.bl-tab{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;padding:10px 2px;border:none;background:none;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:var(--trans)}
.bl-tab:hover{color:var(--text-sub)}
.bl-tab.on{color:var(--text);border-bottom-color:var(--lime)}
.bl-tab span{margin-left:6px;font-size:0.8rem;color:var(--text-dim);font-variant-numeric:tabular-nums}
.bl-row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:9px}
.bl-row .ord{font-variant-numeric:tabular-nums;color:var(--text-dim);font-size:0.9rem;min-width:22px;text-align:center}
.bl-row .info{flex:1;min-width:0;cursor:pointer}
.bl-row .t{font-family:'Space Grotesk',sans-serif;font-size:1.02rem;font-weight:600;color:var(--text);line-height:1.35}
.bl-row .m{font-size:0.85rem;color:var(--text-dim);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bl-row .err{font-size:0.85rem;color:var(--red);margin-top:4px}
.bl-row .acts{display:flex;gap:6px;flex-shrink:0;align-items:center}
.bl-ib{background:transparent;border:1px solid var(--border2);border-radius:7px;color:var(--text-dim);font-family:inherit;font-size:0.95rem;width:32px;height:32px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:var(--trans)}
.bl-ib:hover{border-color:var(--cyan);color:var(--text)}
.bl-ib:disabled{opacity:.35;cursor:default}
.bl-ib.danger:hover{border-color:var(--red);color:var(--red)}
.bl-chip{font-size:0.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.bl-chip.kw{background:var(--cyan-pale);color:var(--cyan);text-transform:none;letter-spacing:0}
.bl-chip.s-written{background:var(--amber-pale);color:var(--amber)}
.bl-chip.s-published{background:var(--green-pale);color:var(--green)}
.bl-view{font-family:'Space Grotesk',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:.04em;color:var(--cyan);border:1px solid var(--border2);border-radius:7px;padding:6px 11px;text-decoration:none;white-space:nowrap;transition:var(--trans);background:transparent;cursor:pointer}
.bl-view:hover{border-color:var(--cyan)}
.bl-empty{color:var(--text-dim);font-size:0.98rem;padding:34px;text-align:center;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-lg)}
.bl-read-ov{position:fixed;inset:0;z-index:900;background:rgba(6,12,20,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}
.bl-read-ov.open{display:flex}
.bl-read{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.bl-read-h{display:flex;align-items:flex-start;gap:16px;padding:22px 26px 14px;border-bottom:1px solid var(--border)}
.bl-read-h h2{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:600;color:var(--text);flex:1;margin:0;line-height:1.3}
.bl-read-h button{background:transparent;border:1px solid var(--border2);border-radius:7px;color:var(--text-sub);padding:6px 12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:0.85rem;flex-shrink:0}
.bl-read-b{overflow-y:auto;padding:22px 26px 30px;font-size:1.02rem;line-height:1.75;color:var(--text-sub)}
.bl-read-b h2,.bl-read-b h3{font-family:'Space Grotesk',sans-serif;color:var(--text);margin:24px 0 8px;font-size:1.15rem}
.bl-read-b p{margin:0 0 15px}
.bl-read-b ul,.bl-read-b ol{margin:0 0 15px 22px}
.bl-read-b li{margin-bottom:7px}
.bl-read-b a{color:var(--cyan)}
@media(max-width:640px){#bl-kw{width:100%}.bl-tabs{gap:16px}}
</style>
</head>

<script src="admin.js?v=20261118"></script>
<script>
const DNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let POSTS = [], SCHED = { on:true, days:[2,5], until:'' }, TAB = 'idea', SITE = 'https://incremento.eu/blog/';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => { if(!s) return ''; try{ return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return s; } };

async function load(){
  try {
    const [p, s] = await Promise.all([ apiFetch('/api/blog-posts'), apiFetch('/api/blog-schedule') ]);
    POSTS = (p && p.posts) || [];
    if (p && p.site) SITE = p.site;
    if (s && s.schedule) SCHED = Object.assign({ on:true, days:[2,5], until:'' }, s.schedule);
  } catch(e) {
    document.getElementById('bl-list').innerHTML = '<div class="bl-empty">Could not load the blog. Check your connection and reload.</div>';
    return;
  }
  renderSched(); renderNext(); renderTabs(); renderList();
}
function count(st){ return POSTS.filter(p => p.status === st).length; }

function renderSched(){
  const el = document.getElementById('bl-sched');
  el.classList.toggle('off', !SCHED.on);
  const days = Array.isArray(SCHED.days) ? SCHED.days : [2,5];
  const pills = [1,2,3,4,5,6,0].map(d =>
    '<button class="bl-dpill ' + (days.includes(d)?'on':'') + '" onclick="toggleDay(' + d + ')">' + DNAMES[d] + '</button>').join('');
  el.innerHTML =
    '<div class="bl-sr">' +
      '<button class="bl-sw ' + (SCHED.on?'on':'') + '" onclick="toggleSched()" aria-label="Toggle schedule"><span></span></button>' +
      '<span class="bl-sw-txt">Auto-publishing is ' + (SCHED.on?'on':'paused') + '</span>' +
    '</div>' +
    '<div class="bl-sr"><span class="lbl">Days</span>' + pills + '</div>' +
    '<div class="bl-sr"><span class="lbl">Until</span>' +
      '<input type="date" value="' + esc(SCHED.until||'') + '" onchange="setUntil(this.value)">' +
      '<span style="font-size:0.9rem;color:var(--text-dim)">' + (SCHED.until?'stops after this date':'runs indefinitely') + '</span>' +
    '</div>';
}
async function saveSched(){ try{ const r = await apiFetch('/api/blog-schedule',{ method:'POST', body:JSON.stringify(SCHED) }); if(r&&r.schedule) SCHED=r.schedule; }catch(e){} }
function toggleSched(){ SCHED.on = !SCHED.on; renderSched(); renderNext(); saveSched(); }
function toggleDay(d){ const s=new Set(SCHED.days||[]); s.has(d)?s.delete(d):s.add(d); SCHED.days=[...s].sort((a,b)=>a-b); renderSched(); renderNext(); saveSched(); }
function setUntil(v){ SCHED.until=v||''; renderSched(); renderNext(); saveSched(); }

function nextSlot(){
  const days = (SCHED.days||[]).length ? SCHED.days : [2,5];
  const d = new Date(); d.setHours(9,0,0,0);
  for (let i=0;i<21;i++){ d.setDate(d.getDate()+1); if (days.includes(d.getDay())){
    if (SCHED.until && d > new Date(SCHED.until+'T23:59:59')) return null;
    return d;
  } }
  return null;
}
function renderNext(){
  const el = document.getElementById('bl-next');
  const ideas = POSTS.filter(p=>p.status==='idea').sort((a,b)=>a.sort-b.sort);
  if (!SCHED.on){ el.className='bl-next paused'; el.innerHTML='<div class="k">Schedule</div><div class="t">Auto-publishing is paused</div><div class="w">Turn it back on above, or use “Write next now” to publish on demand.</div>'; return; }
  if (!ideas.length){ el.className='bl-next empty'; el.innerHTML='<div class="k">Next up</div><div class="t">The queue is empty</div><div class="w">Add a title idea below and it will be written and published automatically.</div>'; return; }
  const slot = nextSlot();
  el.className='bl-next';
  el.innerHTML = '<div class="k">Next up</div><div class="t">' + esc(ideas[0].title) + '</div>'
    + '<div class="w">' + (slot ? 'Writes automatically on ' + slot.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}) + ' at 09:00' : 'The schedule has ended — no more automatic posts') + '</div>';
}

function setTab(t){ TAB=t; renderTabs(); renderList(); }
function renderTabs(){
  document.querySelectorAll('.bl-tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===TAB));
  document.getElementById('c-idea').textContent = count('idea') || '';
  document.getElementById('c-written').textContent = count('written') || '';
  document.getElementById('c-published').textContent = count('published') || '';
  document.getElementById('bl-sub').textContent = count('idea') + ' queued · ' + count('written') + ' written · ' + count('published') + ' live';
}

function renderList(){
  const rows = POSTS.filter(p=>p.status===TAB).sort((a,b)=>
    TAB==='idea' ? a.sort-b.sort : String(b.published_at||b.written_at||'').localeCompare(String(a.published_at||a.written_at||'')));
  const host = document.getElementById('bl-list');
  if (!rows.length){
    const msg = TAB==='idea' ? 'No ideas queued yet — add one above.' : TAB==='written' ? 'Nothing written and waiting.' : 'Nothing published yet.';
    host.innerHTML = '<div class="bl-empty">' + msg + '</div>'; return;
  }
  host.innerHTML = rows.map((p,i) => {
    if (TAB==='idea'){
      return '<div class="bl-row">'
        + '<div class="ord">' + (i+1) + '</div>'
        + '<div class="info">'
        +   '<div class="t">' + esc(p.title) + '</div>'
        +   '<div class="m">' + (p.keyword?'<span class="bl-chip kw">' + esc(p.keyword) + '</span>':'') + (p.angle?'<span>' + esc(p.angle) + '</span>':'') + '</div>'
        +   (p.error?'<div class="err">Last attempt failed: ' + esc(p.error) + '</div>':'')
        + '</div>'
        + '<div class="acts">'
        +   '<button class="bl-ib" onclick="move(' + p.id + ',-1)" ' + (i===0?'disabled':'') + ' title="Move up">↑</button>'
        +   '<button class="bl-ib" onclick="move(' + p.id + ',1)" ' + (i===rows.length-1?'disabled':'') + ' title="Move down">↓</button>'
        +   '<button class="bl-ib danger" onclick="del(' + p.id + ')" title="Delete">✕</button>'
        + '</div></div>';
    }
    if (TAB==='written'){
      return '<div class="bl-row">'
        + '<div class="info" onclick="readPost(' + p.id + ')">'
        +   '<div class="t">' + esc(p.title) + '</div>'
        +   '<div class="m"><span class="bl-chip s-written">Written</span><span>' + (p.words||0) + ' chars</span>' + (p.written_at?'<span>' + fmtDate(p.written_at) + '</span>':'') + '</div>'
        + '</div>'
        + '<div class="acts"><button class="bl-view" onclick="readPost(' + p.id + ')">Read</button></div></div>';
    }
    return '<div class="bl-row">'
      + '<div class="info" onclick="readPost(' + p.id + ')">'
      +   '<div class="t">' + esc(p.title) + '</div>'
      +   '<div class="m"><span class="bl-chip s-published">Live</span>' + (p.published_at?'<span>' + fmtDate(p.published_at) + '</span>':'') + '</div>'
      + '</div>'
      + '<div class="acts">'
      +   '<button class="bl-view" onclick="readPost(' + p.id + ')">Read</button>'
      +   (p.slug?'<a class="bl-view" href="' + esc(SITE) + esc(p.slug) + '/" target="_blank">View live →</a>':'')
      + '</div></div>';
  }).join('');
}

async function addIdea(){
  const ti = document.getElementById('bl-title'), kw = document.getElementById('bl-kw');
  const title = ti.value.trim();
  if (!title){ ti.focus(); return; }
  try {
    await apiFetch('/api/blog-posts', { method:'POST', body:JSON.stringify({ title, keyword:kw.value.trim() }) });
    ti.value=''; kw.value=''; ti.focus();
    await load();
  } catch(e){ alert('Could not add that idea. Please try again.'); }
}

async function move(id, dir){
  const ideas = POSTS.filter(p=>p.status==='idea').sort((a,b)=>a.sort-b.sort);
  const i = ideas.findIndex(p=>p.id===id);
  const j = i+dir;
  if (i<0 || j<0 || j>=ideas.length) return;
  const a = ideas[i], b = ideas[j];
  try {
    await Promise.all([
      apiFetch('/api/blog-posts/'+a.id, { method:'PATCH', body:JSON.stringify({ sort:b.sort }) }),
      apiFetch('/api/blog-posts/'+b.id, { method:'PATCH', body:JSON.stringify({ sort:a.sort }) }),
    ]);
    await load();
  } catch(e){ await load(); }
}

async function del(id){
  const p = POSTS.find(x=>x.id===id);
  if (!(await uiConfirm('“'+(p?p.title:'This idea')+'” will be removed from the queue.', { title:'Delete idea', okText:'Delete' }))) return;
  try { await apiFetch('/api/blog-posts/'+id, { method:'DELETE' }); await load(); }
  catch(e){ alert('Could not delete it. Please try again.'); }
}

async function writeNext(btn){
  const ideas = POSTS.filter(p=>p.status==='idea');
  if (!ideas.length){ alert('The queue is empty — add an idea first.'); return; }
  if (!(await uiConfirm('Claude will write the next queued post now and it will go live on the next site build. This uses the AI budget.', { title:'Write the next post', okText:'Write it', danger:false }))) return;
  btn.disabled = true; const t0 = btn.textContent; btn.textContent = 'Writing…';
  try { const r = await apiFetch('/api/blog-write-next', { method:'POST' }); await load();
        setTab(r && r.status==='written' ? 'written' : TAB); }
  catch(e){ alert('Could not write the post. Please try again.'); }
  btn.disabled = false; btn.textContent = t0;
}

async function readPost(id){
  const ov = document.getElementById('bl-read-ov');
  document.getElementById('bl-read-t').textContent = '…';
  document.getElementById('bl-read-b').innerHTML = '<div class="bl-empty" style="border:none">Loading…</div>';
  ov.classList.add('open');
  try {
    const r = await apiFetch('/api/blog-posts/'+id);
    const p = r && r.post;
    if (!p){ document.getElementById('bl-read-b').textContent='Could not load this post.'; return; }
    document.getElementById('bl-read-t').textContent = p.title || '';
    document.getElementById('bl-read-b').innerHTML = p.body || '<p style="color:var(--text-dim)">Not written yet.</p>';
  } catch(e){ document.getElementById('bl-read-b').textContent='Could not load this post.'; }
}
function closeRead(){ document.getElementById('bl-read-ov').classList.remove('open'); }
document.getElementById('bl-read-ov').addEventListener('click', e=>{ if(e.target.id==='bl-read-ov') closeRead(); });
document.getElementById('bl-title').addEventListener('keydown', e=>{ if(e.key==='Enter') addIdea(); });
document.getElementById('bl-kw').addEventListener('keydown', e=>{ if(e.key==='Enter') addIdea(); });

load();
</script>
</body>
</html>
